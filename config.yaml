name: "Kavita"
description: "Self-hosted digital library server for EPUB, PDF, CBZ/CBR comics and manga"
version: "1.0.0"
slug: "kavita"
url: "https://github.com/sjauijn/kavita-HAOS"
arch:
  - aarch64
  - amd64
startup: services
boot: auto
init: false
apparmor: true
hassio_api: true
homeassistant_api: false
panel_icon: mdi:book-open-page-variant
panel_admin: false

ports:
  5000/tcp: 5000
ports_description:
  5000/tcp: "Kavita web UI"

webui: "[PROTO:ssl]://[HOST]:[PORT:5000]"

map:
  - share:rw
  - media:rw
  - addon_config:rw
  - ssl:ro

environment:
  PUID: "0"
  PGID: "0"

options:
  data_location: /share/kavita
  TZ: Europe/Paris
  ssl: false
  certfile: fullchain.pem
  keyfile: privkey.pem

schema:
  data_location: str
  TZ: str?
  ssl: bool
  certfile: str
  keyfile: str
