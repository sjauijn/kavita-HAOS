name: "Kavita"
description: "Fast, feature rich, cross platform reading server for Comics, Manga, Books, and more."
version: "0.8.7"
slug: "kavita"
url: "https://github.com/Kareadita/Kavita"
init: false
apparmor: true
startup: application
boot: auto
arch:
  - amd64
  - aarch64
map:
  - type: share
    read_only: false
  - type: media
    read_only: false
  - type: ssl
    read_only: true
ports:
  5000/tcp: 5000
ports_description:
  5000/tcp: "Kavita web interface"
webui: "[PROTO:ssl]://[HOST]:[PORT:5000]"
options:
  data_location: "/share/kavita"
  port: 5000
  ssl: false
  certfile: "fullchain.pem"
  keyfile: "privkey.pem"
  tz: "Europe/Paris"
schema:
  data_location: "str"
  port: "port"
  ssl: "bool"
  certfile: "str"
  keyfile: "str"
  tz: "str"
