configuration:
  data_location:
    name: Data location
    description: >-
      Path where Kavita stores its library database, config, cache and covers.
      Defaults to /share/kavita. You can point this at any mapped path, for
      example /media/MegaCloud/kavita.
  port:
    name: Web UI port
    description: >-
      Port Kavita listens on inside the add-on. If you change this, also
      update the container port mapping on the Network tab to match.
  ssl:
    name: Enable SSL
    description: >-
      Serve the Kavita web interface over HTTPS using a certificate from
      the Home Assistant /ssl folder.
  certfile:
    name: Certificate file
    description: Filename of the certificate (chain) inside /ssl, e.g. fullchain.pem.
  keyfile:
    name: Key file
    description: Filename of the private key inside /ssl, e.g. privkey.pem.
  tz:
    name: Timezone
    description: Timezone used by Kavita, e.g. Europe/Paris.
network:
  5000/tcp: Kavita web interface
