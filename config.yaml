name: "Kavita"
description: "Self-hosted digital library server for EPUB, PDF, comics and manga"
version: "1.0.0"
slug: "kavita"
url: "https://github.com/sjauijn/kavita-HAOS/"
init: false
apparmor: true
startup: services
boot: auto
arch:
  - amd64
  - aarch64
ports:
  5000/tcp: 5000
ports_description:
  5000/tcp: "Kavita web UI"
webui: "http://[HOST]:[PORT:5000]"
map:
  - share:rw
  - media:rw
  - addon_config:rw
options:
  puid: 1000
  pgid: 1000
  tz: "Etc/UTC"
  data_location: /share/kavita
schema:
  puid: "int"
  pgid: "int"
  tz: "str"
